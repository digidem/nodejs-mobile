name: Cache credentials

# Assert that the two R2 tokens behind the shared compiler cache still are what
# build.yml assumes: `sccache-read` can read and CANNOT write; `sccache-write`
# can do both. See docs/BUILDING.md, "The CI compiler cache".
#
# This is a scheduled workflow and not a step in build.yml for two reasons:
#
#   1. A job holds exactly one Environment, so a build.yml job can only ever reach
#      one of the two tokens: a PR gets `sccache-read`, a push to `recipe` gets
#      `sccache-write`. No single run of build.yml can test both halves. Only a run
#      on `recipe` that is free to declare either environment can cover both,
#      which is what this is.
#   2. The shape of the failures. None of them break the build that hits them:
#      - read token revoked/expired  -> every build silently drops to 0% hits and
#                                       gets slow. Correct, just expensive.
#      - write token revoked/expired -> writes silently fail, the cache goes stale
#                                       and never recovers.
#      - read token silently granted write -> no functional symptom AT ALL, ever.
#        The security property is gone and nothing observable changes.

on:
  schedule:
    - cron: '17 6 * * *'
  # Run this by hand right after changing either token or either Environment —
  # that is the moment the answer actually matters.
  #
  # Dispatching from a ref OTHER than `recipe` also tests sccache-write's
  # deployment branch rule: GitHub should refuse that leg before any step
  # runs (a failed leg with only a protection-rules annotation). If the leg
  # runs instead, the rule is missing — a guard below fails it rather than
  # letting a live write token on a feature branch report green. A schedule
  # always runs on the default branch, so only a dispatch can test this.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-credentials
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  # Both legs run byte-identical probe code — only the expected statuses
  # differ, so a denial cannot be a bug in code the other leg doesn't run.
  # Plain SigV4 requests rather than sccache: the tokens are what is under
  # test, and every build exercises the sccache integration anyway.
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: sccache-read
            put: '403'
            delete: '403'
          - environment: sccache-write
            put: '200'
            delete: '204'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ENVIRONMENT: ${{ matrix.environment }}
      EXPECT_PUT: ${{ matrix.put }}
      EXPECT_DELETE: ${{ matrix.delete }}
    steps:
      - name: Probe
        run: | #shell
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # Off recipe, GitHub should have refused this leg before any step
          # ran (sccache-write's deployment branch rule). Reaching this line
          # means the rule is missing or widened — the write token is
          # obtainable from arbitrary branches. Never report that as green.
          if [ "$ENVIRONMENT" = sccache-write ] && [ "$GITHUB_REF" != refs/heads/recipe ]; then
            fail "the sccache-write leg ran on $GITHUB_REF — the deployment branch rule restricting sccache-write to recipe is missing"
          fi

          [ -n "$AWS_ACCESS_KEY_ID" ] \
            || fail "no credentials — are the $ENVIRONMENT environment secrets set?"

          key="probe-$ENVIRONMENT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          req() { # request $key with the job's token; print the HTTP status
            curl -sS -o response -w '%{http_code}' \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
              "$@" "$R2_ENDPOINT/$R2_BUCKET/$key"
          }

          # Read: 404 for a key that never existed proves the request was
          # authenticated — a token failure would be 403.
          code=$(req) || fail "GET did not complete (curl exit $?)"
          [ "$code" = 404 ] \
            || { cat response; fail "GET of a missing key returned $code, expected 404 — the token cannot read (revoked/expired?)"; }

          printf 'probe %s\n' "$key" > body
          code=$(req --upload-file body) || fail "PUT did not complete (curl exit $?)"
          [ "$code" = "$EXPECT_PUT" ] \
            || { cat response; fail "PUT returned $code, expected $EXPECT_PUT for $ENVIRONMENT"; }

          # Where the write landed, it must read back byte-identical.
          if [ "$EXPECT_PUT" = 200 ]; then
            code=$(req) || fail "read-back GET did not complete (curl exit $?)"
            [ "$code" = 200 ] || fail "the object just written did not read back (HTTP $code)"
            cmp -s body response || fail "read back different bytes than were written"
          fi

          # DELETE must obey the same split; on the write leg it also cleans up.
          code=$(req -X DELETE) || fail "DELETE did not complete (curl exit $?)"
          [ "$code" = "$EXPECT_DELETE" ] \
            || { cat response; fail "DELETE returned $code, expected $EXPECT_DELETE for $ENVIRONMENT"; }

          echo "OK: $ENVIRONMENT behaves as expected (GET 404, PUT $EXPECT_PUT, DELETE $EXPECT_DELETE)"
